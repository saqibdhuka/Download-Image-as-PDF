<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 16px;
            width: 260px;
            color: #333;
            margin: 0;
        }

        h2 {
            margin: 0 0 6px 0;
            font-size: 16px;
            color: #4F46E5;
        }

        p {
            font-size: 12px;
            color: #666;
            margin-top: 0;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .setting-group {
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 13px;
        }

        /* Toggle Switch CSS */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }

        .toggle-container label {
            margin-bottom: 0;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4F46E5;
        }

        input:checked+.slider:before {
            transform: translateX(14px);
        }

        #status {
            color: #10B981;
            font-size: 12px;
            display: none;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <h2>Image to PDF</h2>
    <p>Right-click any web image to instantly convert and download it as a PDF.</p>

    <div class="toggle-container">
        <label for="enableToggle">Enable Extension</label>
        <label class="switch">
            <input type="checkbox" id="enableToggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="setting-group">
        <label for="pageSize">PDF Page Size</label>
        <select id="pageSize">
            <option value="original">Original Image Size</option>
            <option value="a4">A4 (Portrait)</option>
            <option value="letter">Letter (Portrait)</option>
        </select>
        <div id="status">Settings saved!</div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
